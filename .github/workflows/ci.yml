name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  integration:
    name: PostgreSQL, queue and browser
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: substation
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: substation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U substation -d substation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://substation:ci_only_password@127.0.0.1:5432/substation?schema=public
      TEST_DATABASE_URL: postgresql://substation:ci_only_password@127.0.0.1:5432/substation_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Apply test migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://substation:ci_only_password@127.0.0.1:5432/substation_test?schema=public
      - name: Check migration status
        run: npm run db:status
        env:
          DATABASE_URL: postgresql://substation:ci_only_password@127.0.0.1:5432/substation_test?schema=public
      - name: PostgreSQL and API tests
        run: npm run test:db
      - name: BullMQ and worker tests
        run: npm run test:queue
      - name: Playwright flows
        run: npm run test:e2e
